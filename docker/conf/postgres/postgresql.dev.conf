```bash
#!/usr/bin/env bash

# ============================================================
# PostgreSQL 17 Benchmark PRO
# Ambiente: 4 vCPUs | 8 GB RAM | SSD | Homologação
#
# Recursos:
# - Validação de configuração PostgreSQL
# - Benchmark misto e somente leitura
# - Extração robusta de TPS e latência
# - Monitoramento de CPU, RAM e swap
# - Critérios automáticos PASS / WARN / FAIL
# - Relatórios TXT e CSV
#
# Requisitos:
# Bash 4+, psql, pgbench, createdb, awk
# Linux: /proc/meminfo; vmstat opcional
#
# Não altera postgresql.conf.
# Não remove automaticamente o banco de teste.
# ============================================================

set -Eeuo pipefail
umask 077
export LC_ALL=C

# ---------------- CONFIGURAÇÕES ----------------

PGHOST="${PGHOST:-localhost}"
PGPORT="${PGPORT:-5432}"
PGUSER="${PGUSER:-postgres}"
ADMIN_DB="${ADMIN_DB:-postgres}"

TEST_DB="${TEST_DB:-pgbench_pro_test}"
OUTPUT_DIR="${OUTPUT_DIR:-./relatorio-postgresql17}"

SCALE="${SCALE:-10}"
DURATION="${DURATION:-60}"
CLIENTS="${CLIENTS:-10 25 50}"
JOBS="${JOBS:-4}"
REPETITIONS="${REPETITIONS:-3}"
SAMPLE_INTERVAL="${SAMPLE_INTERVAL:-1}"

# Limites ajustáveis.
MAX_AVG_LATENCY_MS="${MAX_AVG_LATENCY_MS:-100}"
MAX_CPU_PERCENT="${MAX_CPU_PERCENT:-90}"
MAX_RAM_PERCENT="${MAX_RAM_PERCENT:-90}"
MAX_SWAP_USED_MB="${MAX_SWAP_USED_MB:-512}"
MAX_ROLLBACKS="${MAX_ROLLBACKS:-0}"
MIN_TPS="${MIN_TPS:-0}"

# ---------------- ARQUIVOS ----------------

mkdir -p "$OUTPUT_DIR"

REPORT="$OUTPUT_DIR/relatorio.txt"
BENCH_CSV="$OUTPUT_DIR/benchmark.csv"
RESOURCE_CSV="$OUTPUT_DIR/recursos.csv"
CONFIG_CSV="$OUTPUT_DIR/configuracao.csv"
CHECK_CSV="$OUTPUT_DIR/validacoes.csv"
SETTINGS_CSV="$OUTPUT_DIR/parametros.csv"

: > "$REPORT"
: > "$CONFIG_CSV"
: > "$CHECK_CSV"
: > "$SETTINGS_CSV"

printf '%s\n' \
  'cenario,clientes,repeticao,tps,latencia_media_ms,desvio_ms,transacoes,resultado' \
  > "$BENCH_CSV"

printf '%s\n' \
  'timestamp,cpu_percent,ram_percent,swap_used_mb' \
  > "$RESOURCE_CSV"

printf '%s\n' \
  'verificacao,status,detalhe' \
  > "$CHECK_CSV"

# ---------------- STATUS GLOBAL ----------------

OVERALL="PASS"
FAILED=0
WARNINGS=0
SAMPLE_PID=""

log() {
    printf '[%s] %s\n' \
        "$(date '+%F %T')" "$*" | tee -a "$REPORT"
}

fail() {
    log "FAIL: $*"
    exit 2
}

record_check() {
    local name="$1"
    local status="$2"
    local detail="$3"

    detail="${detail//$'\n'/ }"
    detail="${detail//,/;}"

    printf '%s,%s,"%s"\n' \
        "$name" "$status" "$detail" >> "$CHECK_CSV"

    case "$status" in
        FAIL)
            FAILED=$((FAILED + 1))
            OVERALL="FAIL"
            ;;
        WARN)
            WARNINGS=$((WARNINGS + 1))
            if [[ "$OVERALL" != "FAIL" ]]; then
                OVERALL="WARN"
            fi
            ;;
    esac

    log "$status | $name | $detail"
}

require_command() {
    command -v "$1" >/dev/null 2>&1 ||
        fail "Comando obrigatório ausente: $1"
}

# ---------------- PRÉ-REQUISITOS ----------------

for cmd in psql pgbench createdb awk date grep; do
    require_command "$cmd"
done

[[ "$DURATION" =~ ^[1-9][0-9]*$ ]] ||
    fail "DURATION deve ser inteiro positivo."

[[ "$REPETITIONS" =~ ^[1-9][0-9]*$ ]] ||
    fail "REPETITIONS deve ser inteiro positivo."

[[ "$SCALE" =~ ^[1-9][0-9]*$ ]] ||
    fail "SCALE deve ser inteiro positivo."

[[ "$JOBS" =~ ^[1-9][0-9]*$ ]] ||
    fail "JOBS deve ser inteiro positivo."

[[ "$SAMPLE_INTERVAL" =~ ^[1-9][0-9]*$ ]] ||
    fail "SAMPLE_INTERVAL deve ser inteiro positivo."

for n in MAX_AVG_LATENCY_MS MAX_CPU_PERCENT MAX_RAM_PERCENT \
         MAX_SWAP_USED_MB MAX_ROLLBACKS MIN_TPS; do
    [[ "${!n}" =~ ^[0-9]+([.][0-9]+)?$ ]] ||
        fail "$n deve ser numérico e não negativo."
done

PSQL=(
    psql -X -w
    -v ON_ERROR_STOP=1
    -h "$PGHOST"
    -p "$PGPORT"
    -U "$PGUSER"
)

psql_admin() {
    "${PSQL[@]}" -d "$ADMIN_DB" "$@"
}

psql_test() {
    "${PSQL[@]}" -d "$TEST_DB" "$@"
}

log "Iniciando PostgreSQL 17 Benchmark PRO"
log "Servidor: $PGHOST:$PGPORT"
log "Banco de teste: $TEST_DB"

# ---------------- VERSÃO ----------------

SERVER_VERSION_NUM="$(
    psql_admin -Atc "SHOW server_version_num"
)" || fail "Não foi possível conectar ao PostgreSQL."

SERVER_VERSION="$(
    psql_admin -Atc "SHOW server_version"
)"

if [[ ! "$SERVER_VERSION_NUM" =~ ^[0-9]+$ ]] ||
   (( SERVER_VERSION_NUM < 170000 ||
      SERVER_VERSION_NUM >= 180000 )); then
    fail "Esperado PostgreSQL 17. Encontrado: $SERVER_VERSION"
fi

record_check "Versão PostgreSQL" PASS "$SERVER_VERSION"

CLIENT_VERSION="$(pgbench --version 2>&1 | head -n 1)"
CLIENT_MAJOR="$(
    printf '%s\n' "$CLIENT_VERSION" |
    sed -nE 's/.* ([0-9]+)(\.[0-9]+)*$/\1/p'
)"

if [[ "$CLIENT_MAJOR" != "17" ]]; then
    record_check "Versão pgbench" WARN \
        "Cliente: $CLIENT_VERSION. Recomenda-se cliente PostgreSQL 17."
else
    record_check "Versão pgbench" PASS "$CLIENT_VERSION"
fi

# ---------------- CONFIGURAÇÃO ----------------

log "Validando arquivo de configuração..."

CONFIG_ERRORS="$(
    psql_admin -X -A -t -F '|' -c "
        SELECT
            coalesce(sourcefile, ''),
            coalesce(sourceline::text, ''),
            coalesce(name, ''),
            coalesce(error, 'entrada não aplicada')
        FROM pg_file_settings
        WHERE error IS NOT NULL OR applied = false;
    "
)" || fail "Não foi possível consultar pg_file_settings."

if [[ -n "$CONFIG_ERRORS" ]]; then
    record_check "Arquivo de configuração" FAIL \
        "Há erros ou entradas não aplicadas; consulte os detalhes abaixo."
    printf '%s\n' "$CONFIG_ERRORS" | tee -a "$REPORT"
else
    record_check "Arquivo de configuração" PASS \
        "Nenhum erro ou entrada não aplicada."
fi

psql_admin -X -A -F ',' -t -c "
    SELECT name, setting, unit, context, source, pending_restart
    FROM pg_settings
    WHERE name IN (
        'shared_buffers',
        'effective_cache_size',
        'work_mem',
        'maintenance_work_mem',
        'autovacuum_work_mem',
        'max_connections',
        'max_worker_processes',
        'max_parallel_workers',
        'max_parallel_workers_per_gather',
        'autovacuum_max_workers',
        'min_wal_size',
        'max_wal_size',
        'shared_preload_libraries',
        'compute_query_id',
        'track_io_timing'
    )
    ORDER BY name;
" > "$SETTINGS_CSV"

PENDING="$(
    psql_admin -X -A -t -c "
        SELECT count(*)
        FROM pg_settings
        WHERE pending_restart;
    "
)"

if [[ "$PENDING" =~ ^[0-9]+$ ]] && (( PENDING > 0 )); then
    record_check "Reinicialização pendente" WARN \
        "$PENDING parâmetros aguardam reinicialização."
else
    record_check "Reinicialização pendente" PASS \
        "Nenhum parâmetro aguardando reinicialização."
fi

psql_admin -X -A -F ',' -t -c "
    SELECT name, setting, unit, context, source, pending_restart
    FROM pg_settings
    ORDER BY name;
" > "$CONFIG_CSV"

# ---------------- EXTENSÃO ----------------

EXTENSION_PRELOAD="$(
    psql_admin -Atc "
        SELECT current_setting('shared_preload_libraries')
    "
)"

if [[ ",$EXTENSION_PRELOAD," == *",pg_stat_statements,"* ]]; then
    psql_admin -c \
        "CREATE EXTENSION IF NOT EXISTS pg_stat_statements;" \
        >/dev/null

    record_check "pg_stat_statements" PASS \
        "Extensão carregada e instalada no banco administrativo."
else
    record_check "pg_stat_statements" WARN \
        "Não está em shared_preload_libraries; métricas de consultas opcionais."
fi

# ---------------- MONITORAMENTO LINUX ----------------

read_resources() {
    local cpu_idle cpu_usage mem_total mem_available
    local swap_total swap_free swap_used

    cpu_usage=""

    if command -v vmstat >/dev/null 2>&1; then
        cpu_idle="$(
            vmstat 1 2 |
            awk 'NR > 2 { idle=$15 } END { print idle }'
        )"

        if [[ "$cpu_idle" =~ ^[0-9]+$ ]]; then
            cpu_usage=$((100 - cpu_idle))
        fi
    fi

    mem_total="$(
        awk '/^MemTotal:/ {print $2}' /proc/meminfo
    )"

    mem_available="$(
        awk '/^MemAvailable:/ {print $2}' /proc/meminfo
    )"

    swap_total="$(
        awk '/^SwapTotal:/ {print $2}' /proc/meminfo
    )"

    swap_free="$(
        awk '/^SwapFree:/ {print $2}' /proc/meminfo
    )"

    [[ "$mem_total" =~ ^[0-9]+$ ]] || return 1
    [[ "$mem_available" =~ ^[0-9]+$ ]] || return 1

    local ram_used ram_pct
    ram_used=$((mem_total - mem_available))
    ram_pct=$((ram_used * 100 / mem_total))

    swap_used=0
    if [[ "$swap_total" =~ ^[0-9]+$ &&
          "$swap_free" =~ ^[0-9]+$ ]]; then
        swap_used=$(((swap_total - swap_free) / 1024))
    fi

    printf '%s,%s,%s,%s\n' \
        "$(date '+%F %T')" \
        "${cpu_usage:-NA}" \
        "$ram_pct" \
        "$swap_used" >> "$RESOURCE_CSV"
}

monitor_resources() {
    while :; do
        read_resources || true
        sleep "$SAMPLE_INTERVAL"
    done
}

# ---------------- BANCO DE TESTE ----------------

EXISTS="$(
    psql_admin -Atc "
        SELECT EXISTS (
            SELECT 1 FROM pg_database
            WHERE datname = '$TEST_DB'
        );
    "
)"

[[ "$EXISTS" == "f" ]] ||
    fail "Banco $TEST_DB já existe. Defina outro TEST_DB."

log "Criando banco de teste exclusivo..."

createdb \
    -h "$PGHOST" \
    -p "$PGPORT" \
    -U "$PGUSER" \
    "$TEST_DB" ||
    fail "Falha ao criar banco de benchmark."

log "Inicializando dados sintéticos..."

pgbench \
    -h "$PGHOST" \
    -p "$PGPORT" \
    -U "$PGUSER" \
    -i -s "$SCALE" "$TEST_DB" ||
    fail "Falha ao inicializar pgbench."

# ---------------- COLETA DE MÉTRICAS ----------------

# Extrai os campos da saída oficial do pgbench.
# Evita depender de posições fixas de palavras.

extract_metric() {
    local file="$1"
    local pattern="$2"

    awk -v pattern="$pattern" '
        $0 ~ pattern {
            line = $0
            sub(/^.*= */, "", line)
            split(line, fields, /[[:space:]]+/)
            gsub(/[^0-9.eE+-]/, "", fields[1])
            if (fields[1] ~ /^[0-9]+([.][0-9]+)?([eE][+-]?[0-9]+)?$/) {
                value = fields[1]
            }
        }
        END {
            if (value != "") print value
        }
    ' "$file"
}

extract_transactions() {
    awk '
        /number of transactions actually processed:/ {
            value = $NF
        }
        END {
            if (value ~ /^[0-9]+$/) print value
        }
    ' "$1"
}

run_benchmark() {
    local scenario="$1"
    local clients="$2"
    local repetition="$3"
    local logfile="$OUTPUT_DIR/${scenario}_${clients}_r${repetition}.log"
    local args=()

    if [[ "$scenario" == "leitura" ]]; then
        args=(-S)
    fi

    log "Executando $scenario: clientes=$clients, repetição=$repetition"

    if ! pgbench \
        -h "$PGHOST" \
        -p "$PGPORT" \
        -U "$PGUSER" \
        -c "$clients" \
        -j "$JOBS" \
        -T "$DURATION" \
        -P 10 \
        -r \
        "${args[@]}" \
        "$TEST_DB" > "$logfile" 2>&1; then
        cat "$logfile" | tee -a "$REPORT"
        record_check "Benchmark $scenario/$clients/$repetition" FAIL \
            "pgbench terminou com erro."
        return 1
    fi

    cat "$logfile" >> "$REPORT"

    local tps latency deviation transactions result
    tps="$(extract_metric "$logfile" 'tps =')"
    latency="$(extract_metric "$logfile" 'latency average =')"
    deviation="$(extract_metric "$logfile" 'latency stddev =')"
    transactions="$(extract_transactions "$logfile")"

    result="PASS"

    if [[ -z "$tps" || -z "$latency" || -z "$transactions" ]]; then
        result="FAIL"
        record_check "Métricas $scenario/$clients/$repetition" FAIL \
            "Não foi possível extrair todas as métricas."
        tps="${tps:-NA}"
        latency="${latency:-NA}"
        deviation="${deviation:-NA}"
        transactions="${transactions:-NA}"
    else
        if ! awk -v t="$tps" -v min="$MIN_TPS" \
            'BEGIN { exit !(t >= min) }'; then
            result="FAIL"
        fi

        if ! awk -v l="$latency" -v max="$MAX_AVG_LATENCY_MS" \
            'BEGIN { exit !(l <= max) }'; then
            result="FAIL"
        fi

        if [[ "$result" == "FAIL" ]]; then
            record_check "Benchmark $scenario/$clients/$repetition" FAIL \
                "TPS ou latência fora do limite configurado."
        else
            record_check "Benchmark $scenario/$clients/$repetition" PASS \
                "TPS=$tps; latência média=${latency}ms."
        fi
    fi

    printf '%s,%s,%s,%s,%s,%s,%s,%s\n' \
        "$scenario" "$clients" "$repetition" \
        "$tps" "$latency" "${deviation:-NA}" \
        "$transactions" "$result" >> "$BENCH_CSV"

    sleep 2
}

# ---------------- EXECUÇÃO ----------------

log "Iniciando monitoramento de recursos..."

if [[ -r /proc/meminfo ]]; then
    monitor_resources &
    SAMPLE_PID=$!
    read_resources || true
else
    record_check "Monitoramento de RAM" WARN \
        "/proc/meminfo indisponível; métricas Linux não coletadas."
fi

cleanup() {
    if [[ -n "${SAMPLE_PID:-}" ]]; then
        kill "$SAMPLE_PID" 2>/dev/null || true
        wait "$SAMPLE_PID" 2>/dev/null || true
    fi
}
trap cleanup EXIT INT TERM

for scenario in mista leitura; do
    for clients in $CLIENTS; do
        [[ "$clients" =~ ^[1-9][0-9]*$ ]] ||
            fail "Número de clientes inválido: $clients"

        for ((rep = 1; rep <= REPETITIONS; rep++)); do
            run_benchmark "$scenario" "$clients" "$rep" || true
        done
    done
done

cleanup
SAMPLE_PID=""

# ---------------- AVALIAÇÃO DE RECURSOS ----------------

log "Analisando recursos do sistema..."

RESOURCE_SUMMARY="$(
    awk -F, '
        NR > 1 {
            if ($2 != "NA" && $2 ~ /^[0-9]+$/) {
                cpu_sum += $2
                cpu_count++
                if ($2 > cpu_max) cpu_max = $2
            }
            if ($3 ~ /^[0-9]+$/) {
                if ($3 > ram_max) ram_max = $3
            }
            if ($4 ~ /^[0-9]+$/) {
                if ($4 > swap_max) swap_max = $4
            }
        }
        END {
            cpu_avg = cpu_count ? cpu_sum / cpu_count : -1
            printf "%.2f %.0f %.0f %.2f\n",
                cpu_avg, cpu_max, ram_max, swap_max
        }
    ' "$RESOURCE_CSV"
)"

read -r CPU_AVG CPU_MAX RAM_MAX SWAP_MAX <<< "$RESOURCE_SUMMARY"

if [[ "$CPU_MAX" =~ ^[0-9]+$ ]]; then
    if (( CPU_MAX > MAX_CPU_PERCENT )); then
        record_check "CPU máxima" WARN \
            "${CPU_MAX}% excedeu limite ${MAX_CPU_PERCENT}%."
    else
        record_check "CPU máxima" PASS "${CPU_MAX}%."
    fi
else
    record_check "CPU" WARN "CPU não foi medida."
fi

if [[ "$RAM_MAX" =~ ^[0-9]+$ ]]; then
    if (( RAM_MAX > MAX_RAM_PERCENT )); then
        record_check "RAM máxima" WARN \
            "${RAM_MAX}% excedeu limite ${MAX_RAM_PERCENT}%."
    else
        record_check "RAM máxima" PASS "${RAM_MAX}%."
    fi
else
    record_check "RAM" WARN "RAM não foi medida."
fi

if [[ "$SWAP_MAX" =~ ^[0-9]+$ ]]; then
    if (( SWAP_MAX > MAX_SWAP_USED_MB )); then
        record_check "Swap utilizada" WARN \
            "${SWAP_MAX} MB excedeu limite ${MAX_SWAP_USED_MB} MB."
    else
        record_check "Swap utilizada" PASS "${SWAP_MAX} MB."
    fi
else
    record_check "Swap" WARN "Swap não foi medida."
fi

# ---------------- ESTATÍSTICAS DO BANCO ----------------

psql_test -X -A -F ',' -t -c "
    SELECT
        datname,
        numbackends,
        xact_commit,
        xact_rollback,
        deadlocks,
        temp_files,
        temp_bytes,
        blks_read,
        blks_hit
    FROM pg_stat_database
    WHERE datname = current_database();
" > "$OUTPUT_DIR/estatisticas-banco.csv"

# ---------------- STATUS FINAL ----------------

log "Gerando resumo de aprovação..."

{
    echo
    echo "=========================================="
    echo " RELATÓRIO FINAL - POSTGRESQL 17 PRO"
    echo "=========================================="
    echo "Servidor: $PGHOST:$PGPORT"
    echo "Versão: $SERVER_VERSION"
    echo "CPU média amostrada (%): $CPU_AVG"
    echo "CPU máxima amostrada (%): $CPU_MAX"
    echo "RAM máxima amostrada (%): $RAM_MAX"
    echo "Swap máxima utilizada (MB): $SWAP_MAX"
    echo "Falhas: $FAILED"
    echo "Avisos: $WARNINGS"
    echo "Status geral: $OVERALL"
    echo
    echo "Arquivos:"
    echo "- $BENCH_CSV"
    echo "- $RESOURCE_CSV"
    echo "- $CONFIG_CSV"
    echo "- $SETTINGS_CSV"
    echo "- $CHECK_CSV"
    echo "- $OUTPUT_DIR/estatisticas-banco.csv"
    echo
    echo "O banco de teste foi mantido."
    echo "=========================================="
} | tee -a "$REPORT"

case "$OVERALL" in
    PASS) exit 0 ;;
    WARN) exit 1 ;;
    FAIL) exit 2 ;;
esac
```
