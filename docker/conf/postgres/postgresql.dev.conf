
#!/usr/bin/env python3
"""Coletor Linux de CPU e memória sem dependências externas."""

import argparse
import csv
import math
import os
import signal
import sys
import time
from datetime import datetime, timezone
from pathlib import Path

STOP = False
CLK_TCK = os.sysconf("SC_CLK_TCK")


def stop_handler(_signum, _frame):
    global STOP
    STOP = True


def read_host_cpu():
    try:
        fields = Path("/proc/stat").read_text().splitlines()[0].split()
        values = [int(value) for value in fields[1:]]
        idle = values[3] + (values[4] if len(values) > 4 else 0)
        return sum(values), idle
    except (OSError, ValueError, IndexError):
        return None


def read_host_memory():
    try:
        data = {}
        for line in Path("/proc/meminfo").read_text().splitlines():
            key, _, rest = line.partition(":")
            fields = rest.split()
            if fields and key in ("MemTotal", "MemAvailable"):
                data[key] = int(fields[0]) * 1024
        total = data["MemTotal"]
        available = data["MemAvailable"]
        if total <= 0 or available < 0 or available > total:
            return None
        return total - available, total
    except (OSError, ValueError, KeyError):
        return None


def process_snapshot():
    result = {}
    try:
        entries = list(Path("/proc").iterdir())
    except OSError:
        return result

    for entry in entries:
        if not entry.name.isdigit():
            continue
        try:
            stat = (entry / "stat").read_text()
            end = stat.rfind(")")
            fields = stat[end + 2:].split()
            if len(fields) < 22:
                continue
            name = (entry / "comm").read_text().strip().lower()
            if "postgres" not in name and "postmaster" not in name:
                continue
            ticks = int(fields[11]) + int(fields[12])
            rss_mib = 0.0
            for line in (entry / "status").read_text().splitlines():
                if line.startswith("VmRSS:"):
                    rss_mib = int(line.split()[1]) / 1024
                    break
            result[int(entry.name)] = (ticks, rss_mib)
        except (OSError, ValueError, IndexError):
            continue
    return result


def cgroup_v2_paths():
    """Resolve os diretórios cgroup v2 aplicáveis ao processo."""
    try:
        cgroup_path = None
        for line in Path("/proc/self/cgroup").read_text().splitlines():
            if line.startswith("0::"):
                cgroup_path = line.split("::", 1)[1]
                break
        if cgroup_path is None:
            return None

        for line in Path("/proc/self/mountinfo").read_text().splitlines():
            before, separator, after = line.partition(" - ")
            if not separator:
                continue
            fs_fields = after.split()
            if not fs_fields or fs_fields[0] != "cgroup2":
                continue

            mount_fields = before.split()
            mount_root = mount_fields[3].replace(r"\040", " ")
            mount_point = mount_fields[4].replace(r"\040", " ")

            root = Path(mount_root)
            cg = Path(cgroup_path)

            try:
                relative = cg.relative_to(root)
            except ValueError:
                # Mount raiz: caminho do processo relativo a /.
                if str(root) != "/":
                    continue
                relative = Path(str(cg).lstrip("/"))

            candidate = Path(mount_point) / relative
            if (candidate / "cpu.stat").exists():
                return candidate
    except OSError:
        return None
    return None


def read_cgroup(cgroup):
    if cgroup is None:
        return None, None, None
    try:
        cpu = None
        for line in (cgroup / "cpu.stat").read_text().splitlines():
            fields = line.split()
            if len(fields) == 2 and fields[0] == "usage_usec":
                cpu = int(fields[1])
                break
        current = int((cgroup / "memory.current").read_text().strip())
        raw_limit = (cgroup / "memory.max").read_text().strip()
        limit = None if raw_limit == "max" else int(raw_limit)
        return cpu, current, limit
    except (OSError, ValueError):
        return None, None, None


def main():
    parser = argparse.ArgumentParser()
    parser.add_argument("--output", required=True)
    parser.add_argument("--interval", type=float, default=1.0)
    parser.add_argument("--duration", type=float, default=30.0)
    parser.add_argument("--require-postgres", action="store_true")
    parser.add_argument("--require-cgroup", action="store_true")
    args = parser.parse_args()

    if (
        not math.isfinite(args.interval)
        or not math.isfinite(args.duration)
        or args.interval <= 0
        or args.duration <= 0
    ):
        print("FAIL: intervalo e duração devem ser positivos.", file=sys.stderr)
        return 2

    signal.signal(signal.SIGTERM, stop_handler)
    signal.signal(signal.SIGINT, stop_handler)

    output = Path(args.output)
    output.parent.mkdir(parents=True, exist_ok=True)
    cgroup = cgroup_v2_paths()

    columns = [
        "timestamp_utc", "host_cpu_pct",
        "host_mem_used_mib", "host_mem_total_mib",
        "postgres_process_count", "postgres_cpu_pct_one_core",
        "postgres_rss_mib", "cgroup_cpu_pct_one_core",
        "cgroup_mem_current_mib", "cgroup_mem_limit_mib",
        "cgroup_mem_pct",
    ]

    prev_host = read_host_cpu()
    prev_processes = process_snapshot()
    prev_cgroup_cpu, _, _ = read_cgroup(cgroup)
    prev_time = time.monotonic()
    deadline = prev_time + args.duration
    samples = 0
    saw_postgres = False
    saw_cgroup_cpu = False
    saw_cgroup_memory = False

    try:
        with output.open("w", newline="", encoding="utf-8") as stream:
            writer = csv.DictWriter(stream, fieldnames=columns)
            writer.writeheader()
            stream.flush()

            while not STOP:
                remaining = deadline - time.monotonic()
                if remaining <= 0:
                    break
                time.sleep(min(args.interval, remaining))

                now = time.monotonic()
                elapsed = now - prev_time
                if elapsed <= 0:
                    continue

                host = read_host_cpu()
                processes = process_snapshot()
                cg_cpu, cg_mem, cg_limit = read_cgroup(cgroup)
                memory = read_host_memory()

                host_pct = None
                if host and prev_host:
                    total_delta = host[0] - prev_host[0]
                    idle_delta = host[1] - prev_host[1]
                    if total_delta > 0 and 0 <= idle_delta <= total_delta:
                        host_pct = 100 * (total_delta - idle_delta) / total_delta

                common = processes.keys() & prev_processes.keys()
                proc_pct = None
                if common:
                    ticks = sum(
                        max(0, processes[pid][0] - prev_processes[pid][0])
                        for pid in common
                    )
                    proc_pct = ticks / CLK_TCK / elapsed * 100

                proc_rss = sum(value[1] for value in processes.values())
                saw_postgres |= bool(processes)

                cg_pct = None
                if cg_cpu is not None and prev_cgroup_cpu is not None:
                    delta = cg_cpu - prev_cgroup_cpu
                    if delta >= 0:
                        cg_pct = delta / (elapsed * 10000)
                        saw_cgroup_cpu = True

                cg_current_mib = cg_mem / 1048576 if cg_mem is not None else None
                cg_limit_mib = cg_limit / 1048576 if cg_limit is not None else None
                cg_mem_pct = None
                if cg_mem is not None:
                    saw_cgroup_memory = True
                if cg_mem is not None and cg_limit and cg_limit > 0:
                    cg_mem_pct = cg_mem / cg_limit * 100

                writer.writerow({
                    "timestamp_utc": datetime.now(timezone.utc).isoformat(),
                    "host_cpu_pct": host_pct,
                    "host_mem_used_mib": memory[0] / 1048576 if memory else None,
                    "host_mem_total_mib": memory[1] / 1048576 if memory else None,
                    "postgres_process_count": len(processes),
                    "postgres_cpu_pct_one_core": proc_pct,
                    "postgres_rss_mib": proc_rss,
                    "cgroup_cpu_pct_one_core": cg_pct,
                    "cgroup_mem_current_mib": cg_current_mib,
                    "cgroup_mem_limit_mib": cg_limit_mib,
                    "cgroup_mem_pct": cg_mem_pct,
                })
                stream.flush()
                samples += 1
                prev_host, prev_processes = host, processes
                prev_cgroup_cpu, prev_time = cg_cpu, now

    except OSError as exc:
        print(f"FAIL: não foi possível gravar métricas: {exc}", file=sys.stderr)
        return 1

    if samples == 0:
        print("FAIL: nenhuma amostra coletada.", file=sys.stderr)
        return 1
    if args.require_postgres and not saw_postgres:
        print("FAIL: nenhum processo PostgreSQL visível.", file=sys.stderr)
        return 1
    if args.require_cgroup and not (saw_cgroup_cpu and saw_cgroup_memory):
        print("FAIL: métricas cgroup v2 indisponíveis.", file=sys.stderr)
        return 1

    print(f"PASS: {samples} amostras gravadas em {output}")
    return 0


if __name__ == "__main__":
    raise SystemExit(main())