
#!/usr/bin/env python3
"""Análise estrita de latência dos logs do pgbench."""

import argparse
import glob
import json
import math
import re
import sys
from pathlib import Path


def nearest_rank(values, percentile):
    if not values:
        raise ValueError("A amostra está vazia.")
    ordered = sorted(values)
    return ordered[max(0, math.ceil(percentile * len(ordered)) - 1)]


def analyze(prefix):
    paths = sorted(
        Path(path)
        for path in glob.glob(glob.escape(prefix) + ".*")
        if re.fullmatch(re.escape(prefix) + r"\.[0-9]+", path)
        and Path(path).is_file()
    )

    if not paths:
        raise ValueError(f"Nenhum log numérico encontrado para {prefix}")

    latencies = []
    invalid = 0

    for path in paths:
        with path.open(encoding="utf-8") as stream:
            for line in stream:
                fields = line.split()
                if len(fields) < 5:
                    invalid += 1
                    continue
                try:
                    latency = float(fields[2])
                    if not math.isfinite(latency) or latency < 0:
                        raise ValueError
                except ValueError:
                    invalid += 1
                    continue
                latencies.append(latency / 1000.0)

    if invalid:
        raise ValueError(f"{invalid} registro(s) inválido(s) no log.")
    if not latencies:
        raise ValueError("Nenhuma transação válida foi encontrada.")

    return {
        "transactions": len(latencies),
        "invalid_records": invalid,
        "avg_ms": sum(latencies) / len(latencies),
        "p50_ms": nearest_rank(latencies, 0.50),
        "p95_ms": nearest_rank(latencies, 0.95),
        "p99_ms": nearest_rank(latencies, 0.99),
    }


def main():
    parser = argparse.ArgumentParser()
    parser.add_argument("prefix")
    parser.add_argument("--format", choices=("json", "tsv"), default="json")
    args = parser.parse_args()

    try:
        result = analyze(args.prefix)
    except (OSError, ValueError) as exc:
        print(f"FAIL: {exc}", file=sys.stderr)
        return 1

    if args.format == "json":
        print(json.dumps(result, sort_keys=True))
    else:
        keys = (
            "transactions", "avg_ms", "p50_ms",
            "p95_ms", "p99_ms", "invalid_records",
        )
        print("\t".join(str(result[key]) for key in keys))
    return 0


if __name__ == "__main__":
    raise SystemExit(main())